
atlas.pekko {

  # Regex that determines how the path tag value to use when mapping data about an
  # actor into a meter. There a should be a single capture group which will be the
  # path to report.
  path-pattern = "^pekko://(?:[^/]+)/(?:system|user)/([^$\\d/]+).*?$"

  # List of additional actor classes to load
  actors = ${?atlas.pekko.actors} [
    {
      name = "deadLetterStats"
      class = "com.netflix.atlas.pekko.DeadLetterStatsActor"
    }
  ]

  # List of classes to load as API endpoints
  api-endpoints = ${?atlas.pekko.api-endpoints} [
    "com.netflix.atlas.pekko.HealthcheckApi",
    "com.netflix.atlas.pekko.StaticPages"
  ]

  # Hosts that are allowed to make cross origin requests
  # 1. '*' match any host
  # 2. Starts with '.', indicates a sub-domain, for example `.netflix.com`. The origin must
  #    end with the exact string.
  # 3. Otherwise the hostname for the origin must match an entry exactly.
  #
  # An empty list means that CORS headers will not be added.
  cors-host-patterns = ["*"]

  # Headers added to all responses for diagnostic and logging purposes.
  diagnostic-headers = [
    #{
    #  name = "Netflix-ASG"
    #  value = ${NETFLIX_AUTO_SCALE_GROUP}
    #}
  ]

  # Options for the behavior of the default request handler
  request-handler {
    # Should the CORS handler be added? In some cases when proxying requests
    # it can be desirable to disable to avoid having multiple places trying
    # to process CORS headers.
    cors = true

    # Should it automatically handle compression of responses and decompressing
    # requests?
    compression = true

    # Should access logging be enabled?
    access-log = true

    # Probability for adding connection close header to response. A value of 0.0
    # means it will never be added, 1.0 means it will always be added.
    close-probability = 0.0

    # Fully qualified class name of a `RequestAuthenticator` used to establish the
    # identity of the caller from the transport or an upstream proxy. The class must
    # have a constructor that takes a Config or that is empty. If not set, no caller
    # identity is established and endpoints will see the anonymous caller when using
    # the `extractCaller` directive.
    # authenticator = "com.netflix.atlas.pekko.ExampleRequestAuthenticator"
  }

  # Settings for the access log
  access-log {
    # Request header names (case-insensitive) whose values should be redacted in the access
    # log. Use for secrets or bearer tokens forwarded by an upstream proxy so they are not
    # written to the logs. Empty by default.
    sensitive-headers = []
  }

  # Caller aware, weighted concurrency limits for request handling. A request reserves capacity
  # proportional to its estimated cost for the duration it is in flight, from both the per-bucket
  # limiter for its caller and the endpoint's total limiter. Budgets are absolute for a single
  # instance; for a fleet the values should already reflect the per-instance share.
  #
  # Limiting is opt-in per endpoint: an endpoint that is not listed under `endpoints` is not
  # limited at all.
  request-limits {
    # How limit decisions are applied:
    #   off     - disabled, every request is permitted and no capacity is reserved
    #   shadow  - decisions are computed and reported, and capacity is reserved for requests that
    #             would be permitted; requests the policy would deny are still admitted without
    #             reserving capacity, so limits can be observed before enforcing
    #   enforce - requests the policy denies are shed with a 429
    mode = "off"

    # Tuning for buckets that enable fair sharing (see the per-endpoint `fair-share` flag). When a
    # bucket is shared by many callers, this keeps one caller from starving the others: each gets an
    # equal share and may borrow spare capacity, while a caller that keeps getting denied without
    # backing off is held below its share until it stops hammering.
    fair-share {
      # How long after its last attempt a caller still counts as contending.
      window = 5s

      # Demerit at or above which a caller is treated as a hog and held below its fair share.
      penalized-threshold = 3.0

      # Amount added to a caller's demerit each time it is denied.
      demerit-per-denial = 1.0

      # Rate at which a caller's demerit decays while it is not being denied.
      decay-per-second = 0.3

      # Longest a caller can stay penalized after its last denial. Demerit accumulates one step per
      # denial and is clamped only where more of it could not contain a hog any further, so that a
      # hog is held right down to its floor however large the budget is. Decay alone therefore
      # bounds the penalty only by how much was accrued: a sustained burst keeps a caller penalized
      # for far longer than the burst itself. Should be well above `window`.
      max-penalty-duration = 60s

      # Target for the number of callers tracked individually within a bucket. On reaching it the
      # least recently seen caller that holds no permits is forgotten to make room, so a caller
      # able to present many identities cannot grow the tracked set without bound. A caller holding
      # permits is never forgotten, since that would lose the permits it has yet to return, so this
      # is a target rather than a hard ceiling and the set is bounded by the greater of it and the
      # bucket budget. The work done per request does not depend on how many callers are tracked,
      # so this is a memory bound rather than a throughput one. It should be comfortably above the
      # number of distinct callers expected within `window`.
      max-tracked-callers = 1000
    }

    # Per-endpoint budgets. The endpoint name is chosen by the endpoint applying the limit, for
    # example "graph" or "tags".
    endpoints {
      # graph {
      #   # Cap on the combined cost across all buckets of this endpoint. Zero or absent means
      #   # there is no endpoint wide cap and only the per-bucket limits apply.
      #   total-budget = 100
      #
      #   # Whether the shared default bucket enforces per-caller fairness. Defaults to false.
      #   fair-share = true
      #
      #   # Budget for the shared default bucket used by callers without a dedicated budget.
      #   # Required for any listed endpoint.
      #   default-bucket-budget = 20
      #
      #   # Dedicated budgets for provisioned callers, keyed by caller id. A value of zero blocks
      #   # the caller entirely. An authenticated caller is keyed by its identity; a caller still
      #   # using the legacy `id` query parameter is keyed by that value prefixed with "legacy.",
      #   # which keeps self-asserted ids in a namespace of their own so they cannot name an
      #   # authenticated caller and reach its budget.
      #   #
      #   # The two namespaces are separate budgets, so an entry blocks or provisions only the one
      #   # it names: "dashboards = 0" blocks the authenticated caller "dashboards" and does not
      #   # touch a caller sending "?id=dashboards", which needs a "legacy.dashboards" entry of its
      #   # own. Anything unauthenticated and unprovisioned shares the anonymous sub-key.
      #   caller-budgets {
      #     dashboards       = 0
      #     atlas_ui         = 40
      #     "legacy.old_app" = 10
      #   }
      # }
    }
  }

  # Settings for the StaticPages API
  static {
    # Default page to redirect to when hitting /
    default-page = "/ui"

    # For single-page javascript apps, a list of prefixes and the page they map to. Any path with
    # that prefix will return the same page.
    single-page-prefixes = [
      {
        # Path prefix to use. Should be single-level, just the name, with no '/'.
        prefix = "ui"

        # Resource to fetch when the prefix is requested. This is the resource in the classpath
        # not path on the server.
        resource = "www/index.html"
      }
    ]
  }

  # Pointer to an agent facing document describing how to use the service. If a document is
  # available, then a `Link` header with a relation type of `service-doc` is added to all
  # responses so a client that has never seen the API has a single place to look. The document
  # itself should be short and task oriented: what the API is for, the few endpoints that
  # matter, worked examples, and the cost model.
  service-doc {
    # Resource in the classpath with the document to serve at `/.well-known/llms.txt` and the
    # `/llms.txt` alias, for example `www/llms.txt`. Empty, the default, means there is no
    # document: the paths are not mapped and no link header gets added. If the configured
    # resource is not present in the classpath, then it is treated the same as if it were
    # empty.
    resource = ""

    # Summary of what is at the other end of the link. This is what makes a client decide the
    # fetch is worth doing, so it should name the contents rather than just say "docs". Should
    # be set along with the resource above.
    title = ""
  }

  # Name of the actor system
  name = "atlas"

  # Ports to use for the web server
  ports = [
    {
      port = 7101
      secure = false
    },
    #{
    #  port = 7102
    #  secure = true
    #  context-factory = "com.netflix.atlas.pekko.ConfigConnectionContextFactory"
    #  ssl-config {
    #    // See https://lightbend.github.io/ssl-config/KeyStores.html
    #  }
    #}
  ]

  # How long to wait before giving up on bind
  bind-timeout = 5 seconds

  blocking-queue {
    # If the queue is empty when pulled, then it will keep checking until some new
    # data is available. This mechanism is simpler than juggling async callbacks and
    # ensures the overhead is limited to the queue. There is some risk if there is
    # bursty data that it could increase the rate of drops due to the queue being full
    # while waiting for the delay.
    frequency = 100ms
  }

  # Maximum size for collecting ByteStrings from a stream. This prevents memory issues
  # from extremely large messages. Default is 100 MiB.
  max-bytestring-size = 100MiB

  # Settings for spectator IPC logging
  ipc-logger {
    # Should inflight metrics be enabled? They are confusing and generally not useful.
    inflight-metrics-enabled = false

    # Maximum number of values permitted for tag keys on IPC metrics
    cardinality-limit {
      default = 25
      id = 100
    }

    # Size of queue for reusing logger entries
    entry-queue-size = 1000
  }
}

pekko {
  # Sometimes see timeouts related to logging, maybe related to something about M1 Macs
  logger-startup-timeout = 30s
  loggers = ["org.apache.pekko.event.slf4j.Slf4jLogger"]
  logging-filter = "org.apache.pekko.event.slf4j.Slf4jLoggingFilter"
  loglevel = "INFO"
  actor {
    debug {
      receive = on
      autoreceive = on
      lifecycle = on
    }

    deployment {
      /request-handler {
        router = round-robin-pool
        nr-of-instances = 8
      }
    }
  }

  io {
    tcp {
      max-channels = 256000
      trace-logging = off
    }
  }
}

pekko.http {
  client {
  }

  host-connection-pool {
    max-connections = 10
    max-retries = 0
    idle-timeout = 30 s
  }

  server {
    server-header = atlas/1.6

    # uncomment the next line for making this an HTTPS example
    # ssl-encryption = on
    idle-timeout = 30 s
    request-timeout = 10 s
    pipelining-limit = 20

    # Add the remote address into the request, useful for trying to figure out where traffic
    # is coming from.
    remote-address-header = on

    verbose-error-messages = on

  }

  parsing {
    uri-parsing-mode = relaxed
    max-uri-length = 4k
    max-content-length = 8m
  }
}
